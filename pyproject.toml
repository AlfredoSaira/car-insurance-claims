[project]
name = "car-insurance-claims"
version = "0.1.0"
description = "Predict motor insurance claim frequency (freMTPL2) and serve it as a web service - ML Zoomcamp 2026 midterm"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.2",
    "numpy>=2.4.6",
    "pandas>=3.1.1",
    "pydantic>=2.14.3",
    "scikit-learn==1.7.2",
    "uvicorn[standard]>=0.54.0",
    "xgboost-cpu==3.2.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "jupyter>=1.1.1",
    "matplotlib>=3.11.2",
    "nbconvert>=7.17.2",
    "pytest>=9.2.0",
    "requests>=2.34.2",
    "seaborn>=0.13.2",
]
