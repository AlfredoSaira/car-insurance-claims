apiVersion: apps/v1
kind: Deployment
metadata:
  name: claim-frequency
  labels:
    app: claim-frequency
spec:
  replicas: 2
  selector:
    matchLabels:
      app: claim-frequency
  template:
    metadata:
      labels:
        app: claim-frequency
    spec:
      containers:
        - name: api
          image: claim-frequency:v1
          imagePullPolicy: Never   # image is loaded into kind with `kind load docker-image`
          ports:
            - containerPort: 9696
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            httpGet: {path: /health, port: 9696}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 9696}
            initialDelaySeconds: 10
            periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: claim-frequency
  labels:
    app: claim-frequency
spec:
  type: NodePort
  selector:
    app: claim-frequency
  ports:
    - port: 80
      targetPort: 9696
      nodePort: 30096
